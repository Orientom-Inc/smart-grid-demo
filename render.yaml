# Render blueprint. The API needs its own host: Streamlit Community Cloud
# runs Streamlit only and cannot serve FastAPI.
services:
  - type: web
    name: qmems-api
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements-api.txt
      PYTHONPATH=src python -m qmems_cache.build_cache --days 10 --test-days 3 --seed 0
    startCommand: uvicorn qmems_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHONPATH
        value: src
      - key: QMEMS_CACHE_DIR
        value: ./cache
      - key: QMEMS_ENABLE_LIVE_SOLVE
        value: "false"
