# Conda alternative to INSTALL.py.
#
#   conda env create -f environment.yml
#   conda activate qmems
#   python RUN_DEMO.py
#
# INSTALL.py is the recommended path -- it also builds the results cache and
# self-checks it. This file only creates the environment.
name: qmems
channels:
  - conda-forge
dependencies:
  - python=3.11
  # scientific core (conda builds are faster and avoid compiler issues)
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.0
  - matplotlib>=3.8
  - pip
  - pip:
      # solver stack
      - pyomo>=6.7
      - highspy>=1.7
      # API
      - fastapi>=0.110
      - uvicorn[standard]>=0.29
      - pydantic>=2.6
      - pydantic-settings>=2.2
      # client
      - streamlit>=1.33
      - plotly>=5.20
      - httpx>=0.27
      # dev
      - pytest>=8.0
      - ruff>=0.4
